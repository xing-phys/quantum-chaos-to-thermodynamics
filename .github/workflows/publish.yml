name: Build and publish book
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: quarto-book-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
          tinytex: true
      - uses: actions/configure-pages@v5
      - name: Render HTML and PDF
        run: quarto render
      - name: Validate references and navigation
        run: python3 scripts/check_book.py
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
