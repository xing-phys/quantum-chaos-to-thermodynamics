project:
  type: book
  output-dir: _site
  resources: [.nojekyll, scripts/, data/, Project.toml, Manifest.toml]
book:
  title: "Quantum Chaos to Thermodynamics"
  output-file: quantum-chaos-to-thermodynamics
  subtitle: "A course companion on eigenstate thermalization"
  author:
    - name: Ze-Yu Xing
      orcid: 0009-0009-5655-0187
      affiliations:
        - Institute of Physics, Chinese Academy of Sciences
        - University of Chinese Academy of Sciences
  date: "2026-10-19"
  date-format: long
  site-url: https://xing-phys.github.io/quantum-chaos-to-thermodynamics/
  repo-url: https://github.com/xing-phys/quantum-chaos-to-thermodynamics
  repo-actions: [edit, issue, source]
  search: true
  downloads: [pdf]
  chapters:
    - index.qmd
    - part: "From dynamics to thermal states"
      chapters: [01-foundations.qmd, 02-classical-chaos.qmd, 03-random-matrices.qmd, 04-many-body-chaos.qmd, 05-eth.qmd, 06-quenches.qmd]
    - part: "Thermodynamics from microscopic dynamics"
      chapters: [07-entropy.qmd, 08-fluctuation-theorems.qmd, 09-response.qmd, 10-driven-systems.qmd]
    - part: "Constraints and long-lived memory"
      chapters: [11-integrability.qmd, 12-prethermalization.qmd]
    - part: "Work through it"
      chapters: [13-mathematical-appendices.qmd, 14-numerical-lab.qmd, coverage.qmd, references.qmd]
  page-footer:
    left: "An independent, open course companion · v0.1"
    right: "Built with Quarto · CC BY 4.0"
bibliography: [assets/bibliography.bib, assets/foundations.bib, assets/thermodynamics.bib, assets/integrability.bib]
csl: assets/american-physics-society.csl
link-citations: true
filters: [scripts/vector-figures.lua]
lang: en
execute:
  enabled: false
format:
  html:
    theme:
      light: [cosmo, assets/theme-light.scss]
      dark: [darkly, assets/theme-dark.scss]
    css: assets/styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    fig-responsive: true
    code-copy: true
    code-overflow: wrap
    include-in-header: assets/mathjax-config.html
    reference-location: section
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex
    papersize: a4
    geometry: [margin=24mm]
    fontsize: 11pt
    colorlinks: true
    toc: true
    toc-depth: 2
    number-sections: true
    include-in-header: assets/macros.sty
    keep-tex: false
    reference-location: document
